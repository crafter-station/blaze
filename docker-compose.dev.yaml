# Local development stack — never deployed.
#
#   docker compose -f docker-compose.dev.yaml up -d
#   bun run dev:seed -- --email you+clerk_test@example.com
#
# One control-plane Postgres (blaze's own database) plus one instance of every SQL engine,
# each holding a single tenant database owned by an unprivileged role, exactly like the
# shared instances in production. The SQL console connects as that role, so grants behave
# the way they do for real tenants. Host ports are deliberately off the defaults so this
# never collides with a Postgres or MySQL already running on the machine.
#
# Plus one Redis 8 configured like a dedicated tenant container (blaze/redis-tls): TLS is
# the only listener, 64 MB `maxmemory` with `noeviction`, append-only persistence, and the
# tenant is the ACL user `default`.
#
# Plus one MongoDB 8 built from infra/mongo-tls — the same image as the shared production
# instance: TLS is the only listener (requireTLS, a throwaway self-signed certificate made at
# build time), auth on, and the tenant is a user with `dbOwner` on its own database.
#
# See README → "Local SQL engines", "Local Redis" and "Local MongoDB".

name: blaze-dev

services:
  control:
    image: postgres:18
    environment:
      POSTGRES_USER: blaze
      POSTGRES_PASSWORD: blaze
      POSTGRES_DB: blaze
    ports:
      - "127.0.0.1:54320:5432"
    volumes:
      - control:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blaze -d blaze"]
      interval: 2s
      retries: 30

  postgres:
    image: postgres:18
    # TLS on, with the image's snakeoil certificate: the tenant connection path insists on
    # an encrypted hop (sslmode=no-verify), as it does against the real instances.
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      - -c
      - ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:54321:5432"
    volumes:
      - postgres:/var/lib/postgresql
      - ./dev/postgres-init.sql:/docker-entrypoint-initdb.d/10-tenant.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      # The image creates this user with ALL on this database and nothing else.
      MYSQL_DATABASE: db_shop_dev
      MYSQL_USER: u_shop_dev
      MYSQL_PASSWORD: devpassword-shop
    ports:
      - "127.0.0.1:33061:3306"
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 3s
      retries: 40

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: db_shop_dev
      MARIADB_USER: u_shop_dev
      MARIADB_PASSWORD: devpassword-shop
    ports:
      - "127.0.0.1:33062:3306"
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 40

  libsql:
    image: ghcr.io/tursodatabase/libsql-server:v0.24.32
    ports:
      - "127.0.0.1:58080:8080"
    volumes:
      - libsql:/var/lib/sqld

  # Generates the self-signed certificate the Redis TLS listener presents, once, into a
  # volume. Uses the postgres image only because it already ships openssl; redis:8 does not.
  redis-certs:
    image: postgres:18
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -s /tls/redis.crt ]; then
          openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -subj /CN=blaze-dev-redis             -keyout /tls/redis.key -out /tls/redis.crt
        fi
        chmod 644 /tls/redis.key /tls/redis.crt
    volumes:
      - redis-tls:/tls

  redis:
    image: redis:8
    depends_on:
      redis-certs:
        condition: service_completed_successfully
    # Starts through the image's own entrypoint, which appends `--loadmodule` for every
    # bundled module (JSON, Search, TimeSeries, Bloom). `--port 0` closes plaintext.
    command:
      - redis-server
      - --port
      - "0"
      - --tls-port
      - "6379"
      - --tls-cert-file
      - /tls/redis.crt
      - --tls-key-file
      - /tls/redis.key
      - --tls-ca-cert-file
      - /tls/redis.crt
      - --tls-auth-clients
      - "no"
      - --maxmemory
      - "67108864"
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --aclfile
      - /etc/redis/users.acl
    ports:
      - "127.0.0.1:63791:6379"
    volumes:
      - redis:/data
      - redis-tls:/tls:ro
      - ./dev/redis/users.acl:/etc/redis/users.acl:ro
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --tls --insecure --user blazeadmin --pass devpassword-blazeadmin --no-auth-warning ping | grep -q PONG
      interval: 2s
      retries: 30

  mongo:
    build: ./infra/mongo-tls
    image: blaze-dev/mongo-tls
    environment:
      MONGO_INITDB_ROOT_USERNAME: blazeadmin
      MONGO_INITDB_ROOT_PASSWORD: devpassword-blazeadmin
    # 27018, not 27017, so this never collides with a Mongo already running on the machine.
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo:/data/db
    # The image's own HEALTHCHECK pings over TLS.

volumes:
  control:
  postgres:
  mysql:
  mariadb:
  libsql:
  redis:
  redis-tls:
  mongo:
